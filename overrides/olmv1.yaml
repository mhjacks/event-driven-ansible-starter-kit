---
clusterGroup:
  subscriptions:
    quay-operator:
      name: quay-operator
      namespace: redhat-quay
      channels: [ "stable-3.12" ]
      serviceAccountName: quay-sa

vp-rbac:
  serviceAccounts:
    quay-sa:
      namespace: redhat-quay
      roleBindings:
        clusterRoles:
          - cluster-admin
