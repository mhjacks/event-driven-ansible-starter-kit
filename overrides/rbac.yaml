---
clusterGroup:
  rbac:
    serviceAccounts:
      testAccount:
        disabled: true
        name: test
        namespace: default
    roleBindings:
      view-secrets-cms:
        disabled: true
        scope:
          cluster: true
        name: view-secrets-cms
        subjects:
          - kind: ServiceAccount
            name: test
            namespace: default
            apiGroup: ""
        roleRef:
          kind: ClusterRole
          name: view-secrets-cms
    roles:
      view-secrets-cms:
        disabled: true
        name: view-secrets-cms
        scope:
          cluster: true
        rules:
          - apiGroups:
              - '""'
            resources:
              - secrets
              - configmaps
            verbs:
              - "get"
              - "list"
              - "watch"
