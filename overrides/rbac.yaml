---
vp-rbac:
  serviceAccounts:
    web-terminal-sa:
      namespace: openshift-operators
      roleBindings:
        clusterRoles:
          - cluster-admin
    test-admin:
      namespace: aap-config
      roleBindings:
        clusterRoles:
          - cluster-admin
          - view-secrets-cms
        roles:
          - testrole
  createRoles:
    testrole:
      namespace: aap-config
      rules:
        - apiGroups:
            - '""'
          resources:
            - configmaps
          verbs:
            - "list"
            - "watch"
  createClusterRoles:
    view-secrets-cms:
      rules:
        - apiGroups:
            - '""'
          resources:
            - secrets
            - configmaps
          verbs:
            - "get"
            - "list"
            - "watch"
