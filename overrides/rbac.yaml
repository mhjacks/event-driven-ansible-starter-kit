---
clusterGroup:
  rbac:
    serviceAccounts:
      testAccount:
        disabled: true
        name: test
        namespace: default
    roleBindings:
      view-secrets-cms:
        diabled: true
    roles:
      view-secrets-cms:
        disabled: true
        name: view-secrets-cms
        scope:
          cluster: true
        rules:
          - apiGroups:
              - '""'
            resources:
              - secrets
              - configmaps
            verbs:
              - "get"
              - "list"
              - "watch"
