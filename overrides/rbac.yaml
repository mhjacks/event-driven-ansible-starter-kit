---
clusterGroup:
  rbac:
    serviceAccounts:
      testAccount:
        name: test-admin
        namespace: default
        roleBindings:
          clusterRoles:
            - cluster-admin
            - view-secrets-cms
    createClusterRoles:
      view-secrets-cms:
        name: view-secrets-cms
        rules:
          - apiGroups:
              - '""'
            resources:
              - secrets
              - configmaps
            verbs:
              - "get"
              - "list"
              - "watch"
